<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="description" content="Personal study planner for asynchronous university courses." />
    <title>Semestre</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Apply the saved theme before first paint. React reconciles this again
      // in an effect, but that runs too late to stop a full-screen flash.
      (function () {
        var theme = 'dark'
        try {
          var raw = localStorage.getItem('semestre.db.v1')
          if (raw) theme = JSON.parse(raw).settings.theme === 'light' ? 'light' : 'dark'
        } catch (e) {
          /* private window, blocked storage, or a half-written payload */
        }
        document.documentElement.className = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f7f7f9' : '#08080c')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
